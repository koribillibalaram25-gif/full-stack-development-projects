<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <header>

    <section id="register-form">
    <h2>Create an Acoount</h2>
    <form action="#" method="post">
        <fieldset>
            <legend><p>Personal Information</p></legend>
        <label for="name">Full name:</label>
        <input type="text" id="name" name="name" required>
        <br  />
        <br  />
        <label for="mail">Email:</label>
        <input type="email" id="mail" name="mail" required>
        <br  />
        <br  />
        <label for="name">username:</label>
            <input type="text" id="name" name="name" required>
            <br  />
            <br  />
            <label for="pass">password:</label>
            <input type="password" id="pass" name="pass" required>
            <br  />
            <br  />
        <label for="usertype">user type:</label>
        <select id="usertype" name="usertype" required>
            <option disabled selected>select your user type</option>
            <option value="student">student</option>
            <option value="instructor">instructor</option>
        </select> 
            <br  />
            <br  />
            <label for="course">Select course:</label>
            <select id="course" name="course" required>
                <option value="course1">course 1- web development</option>
                <option value="course2">course 2- Data Sceince Fundamentals</option>
                <option value="course3"> course 3- Digital Marketing Mastery</option>
                <option value="course4">course 4- Android Development</option>
            </select>
            <br  />
            <br  />
            <button type="submit">Registert</button>
        </fieldset>
</form>
    </section>
    
</body>
