<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <header>
    <h1>Music Player</h1>
    <button id="theme-btn">Toggle Theme</button>
  </header>

  <main class="container">

    <section class="all-songs">
      <h2>All Songs</h2>

      <select id="genre-filter">
        <option value="all">All</option>
        <option value="Pop">Pop</option>
        <option value="Hip Hop">Hip Hop</option>
        <option value="Rock">Rock</option>
      </select>

      <div id="songs-list"></div>
    </section>

    <section class="song-card">
      <img id="song-image" src="" alt="">
      <h2 id="song-name"></h2>
      <h3 id="song-artist"></h3>

      <audio id="audio-player" controls></audio>

      <div>
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
      </div>

      <div>
        <select id="playlist-select"></select>
        <button id="add-playlist-btn">Add To Playlist</button>
      </div>
    </section>

    <section class="playlist-section">
      <h2>Playlists</h2>

      <input
        type="text"
        id="playlist-name"
        placeholder="Playlist Name"
      >

      <button id="create-playlist-btn">
        Create Playlist
      </button>

      <div id="playlists"></div> 

      <div id="playlist-songs"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
